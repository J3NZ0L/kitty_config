# Seamless SSH clipboard experience
clipboard_control write-clipboard write-primary read-clipboard read-primary

# kitty-kitten-search
map kitty_mod+f      launch --allow-remote-control kitty +kitten kitty_search/search.py @active-kitty-window-id

map ctrl+shift+á next_window
map ctrl+shift+é prev_window

# BEGIN_KITTY_FONTS
font_family      family=Hack style=Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS


# BEGIN_KITTY_THEME
# Bluloco Dark
include current-theme.conf
# END_KITTY_THEME
